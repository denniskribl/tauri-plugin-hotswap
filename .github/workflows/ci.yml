name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: EmbarkStudios/cargo-deny-action@3fd3802e88374d3fe9159b834c7714ec57d6c979 # v2.0.15

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@8cbdedb5103daa674dcf46d3590fe06a76645684 # v2.8.0

      - name: Format check
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --all-features -- -D warnings

      - name: Test (rustls-tls, default)
        run: cargo test --features zip

      - name: Test (native-tls)
        run: cargo test --no-default-features --features native-tls,zip

      - name: Rustdoc
        if: runner.os == 'Linux'
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --all-features

  # Every feature on its own, with and without defaults, so a feature can't
  # silently depend on another one being enabled.
  features:
    name: Feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@8cbdedb5103daa674dcf46d3590fe06a76645684 # v2.8.0

      - name: Install cargo-hack
        uses: taiki-e/install-action@80e6af7a2ec7f280fffe2d0a9d3a12a9d11d86e9 # v2
        with:
          tool: cargo-hack

      # Every combination that has a TLS backend (none is a compile error).
      - name: Check feature combinations
        run: cargo hack check --feature-powerset --at-least-one-of rustls-tls,native-tls,native-tls-vendored --no-dev-deps

  # Each TLS feature must keep the other stack out of the build, on every
  # target (see docs/decisions/0001-network-layer-and-tls.md).
  tls-deps:
    name: TLS dependency graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Check dependency graphs
        run: |
          set -euo pipefail
          fail=0
          deny() { # <target> <forbidden crate> <cargo args...>
            local target="$1" crate="$2"; shift 2
            if cargo tree -e normal --target "$target" --prefix none --format '{p}' "$@" \
                | grep -q "^$crate "; then
              echo "::error::$crate is in the graph for $target with [$*]"
              fail=1
            fi
          }
          for t in x86_64-unknown-linux-gnu x86_64-pc-windows-msvc aarch64-apple-darwin \
                   aarch64-apple-ios aarch64-linux-android; do
            deny "$t" openssl-sys
            deny "$t" aws-lc-sys
            deny "$t" ring --no-default-features --features native-tls
            deny "$t" ring --no-default-features --features native-tls-vendored
          done
          exit "$fail"

  # Android and iOS are supported platforms, so they get a compile check.
  # (No device tests: those need an emulator/simulator and a host app.)
  mobile:
    name: Mobile (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            os: ubuntu-latest
          - target: aarch64-apple-ios
            os: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@8cbdedb5103daa674dcf46d3590fe06a76645684 # v2.8.0
        with:
          key: ${{ matrix.target }}

      # C dependencies (ring, vendored OpenSSL) need the NDK toolchain.
      - name: Configure Android NDK
        if: matrix.target == 'aarch64-linux-android'
        run: |
          BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "$BIN" >> "$GITHUB_PATH"
          {
            echo "CC_aarch64_linux_android=$BIN/aarch64-linux-android24-clang"
            echo "AR_aarch64_linux_android=$BIN/llvm-ar"
            echo "RANLIB_aarch64_linux_android=$BIN/llvm-ranlib"
          } >> "$GITHUB_ENV"

      - name: Check (rustls-tls, default)
        run: cargo check --features zip --target ${{ matrix.target }}

      # Android has no system OpenSSL, so native-tls is checked with the vendored build.
      - name: Check (native-tls)
        run: |
          if [ "${{ matrix.target }}" = aarch64-linux-android ]; then
            cargo check --no-default-features --features native-tls-vendored,zip --target ${{ matrix.target }}
          else
            cargo check --no-default-features --features native-tls,zip --target ${{ matrix.target }}
          fi

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@8cbdedb5103daa674dcf46d3590fe06a76645684 # v2.8.0

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@80e6af7a2ec7f280fffe2d0a9d3a12a9d11d86e9 # v2
        with:
          # Pinned: 0.8.x can't find test binaries in Cargo 1.100's new
          # build-dir layout (taiki-e/cargo-llvm-cov#536).
          tool: cargo-llvm-cov@0.9.1

      - name: Generate coverage
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  guest-js:
    name: Guest JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install
        working-directory: guest-js
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: guest-js
        run: pnpm build
