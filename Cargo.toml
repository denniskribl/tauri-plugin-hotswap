[package]
name = "tauri-plugin-hotswap"
version = "0.0.5"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Open-source OTA plugin for Tauri v2 — push frontend updates to users without rebuilding the binary. Self-hosted, signed bundles, auto-rollback."
repository = "https://github.com/denniskribl/tauri-plugin-hotswap"
documentation = "https://docs.rs/tauri-plugin-hotswap"
readme = "README.md"
keywords = ["tauri", "plugin", "ota", "hotswap", "update"]
categories = ["gui", "web-programming"]
links = "tauri-plugin-hotswap"
exclude = [
    ".github/",
    ".gitignore",
    "website/",
    "docs/",
    "examples/",
    "Cargo.lock",
    "CLAUDE.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "deny.toml",
    "rustfmt.toml",
    "guest-js/pnpm-lock.yaml",
]

[lib]
name = "tauri_plugin_hotswap"
path = "src/lib.rs"

[features]
default = ["rustls-tls"]
zip = ["dep:zip"]
# TLS backend for the built-in HTTP client. At least one is required; if both
# are enabled, native-tls wins. See docs/decisions/0001-network-layer-and-tls.md.
rustls-tls = [
    "reqwest/rustls-no-provider",
    "dep:rustls",
    "dep:rustls-platform-verifier",
    "dep:webpki-roots",
]
native-tls = ["reqwest/native-tls"]
native-tls-vendored = ["native-tls", "reqwest/native-tls-vendored"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = "2"
log = "0.4"
# `system-proxy`: honour the OS proxy settings, as 0.0.x did on desktop.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
tokio = { version = "1", features = ["fs", "io-util", "time"] }
semver = "1"
minisign-verify = "0.2"
tar = "0.4"
flate2 = "1"
thiserror = "2"
base64 = "0.22"
url = "2"
dirs = "6"
zip = { version = "9", optional = true }

# rustls-tls: the OS verifies certificates, except on Android (bundled roots;
# the Android platform verifier needs Kotlin/JNI setup, see #27).
[target.'cfg(not(target_os = "android"))'.dependencies]
rustls-platform-verifier = { version = "0.7", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
webpki-roots = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }
tauri = { version = "2", features = ["test"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
